# Image cache and resizer for Remux.
#
# Remux ignores every image size parameter and fetches a poster from TMDB on every request. This sits
# in front of GET and HEAD on /items/{id}/images/{type} only. It shrinks posters and thumbs to fixed
# widths, keeps the result on disk, and leaves everything else at its original size.
#
# There are two servers, because a response has to be resized before it can be cached:
#   :8080 checks the request and answers from the disk cache.
#   :8081 fetches from Remux and resizes. Only :8080 can reach it, and only on a cache miss.
#
# Nothing here sends a query string to Remux. The few values that matter are in the cache key below.
load_module modules/ngx_http_image_filter_module.so;

user nginx;
# A resize blocks its worker, so two workers means at most two cores resizing, whatever the burst.
worker_processes 2;
error_log /dev/stderr error;
events { worker_connections 1024; }

http {
  access_log off;
  server_tokens off;
  sendfile on;
  # Longer than Traefik's 90 s idle timeout, so Traefik never reuses a connection nginx just closed.
  keepalive_timeout 120s;
  resolver 127.0.0.11 valid=30s;

  # An entry can stay on disk for its life (120 days, below) plus this inactive time. A restart resets that
  # timer, so a daily sweep in compose.yaml removes anything older than 178 days, which keeps everything inside
  # TMDB's limit of 6 months. Each megabyte of keys_zone holds about 8000 entries.
  proxy_cache_path /cache levels=1:2 keys_zone=img:192m max_size=60g min_free=5g inactive=60d use_temp_path=off;

  # A burst of first views: the first 40 go straight through, then Remux gets 20 a second. Past 300
  # waiting, :8080 fetches the original directly, so a client gets a bigger image, not a broken one.
  limit_req_zone $server_port zone=remux_fetch:1m rate=20r/s;

  # The tag is part of the cache key, so a value of any other shape is refused. That keeps one-off
  # junk from filling the cache. Tags seen: a row id of 36 characters, id-unixtime of 47 on collections
  # and 32 hex from /items/{id}/images. Any new format made of letters, digits, "-" and "_" also passes,
  # so a Remux update can't turn posters into 403s.
  map $arg_tag $tag_ok {
    default 0;
    "" 1;
    "~^[A-Za-z0-9_-]{1,64}$" 1;
  }

  # Clients differ in how they write these, so these spellings share one cache entry.
  map $img_id $img_id_key {
    default $img_id;
    "~^([0-9a-fA-F]{8})-?([0-9a-fA-F]{4})-?([0-9a-fA-F]{4})-?([0-9a-fA-F]{4})-?([0-9a-fA-F]{12})$" $1$2$3$4$5;
  }
  map $img_type $img_type_key {
    "~*^primary$" primary;
    "~*^thumb$" thumb;
    "~*^backdrop$" backdrop;
    # Remux treats logoimageaspectratio as logo, so they share an entry.
    "~*^logo(imageaspectratio)?$" logo;
  }
  # Remux has one image of each type and ignores the index, so these share an entry too.
  map $img_idx $img_idx_key {
    default $img_idx;
    "/0" "";
  }

  # Fixed steps, so the many sizes clients ask for share one cached copy. Height is never used:
  # Remux reports posters as 0.6 wide when they are really 0.667, and cropping them cuts off overlays
  # (remux #435). 0 means leave the image at its original size.
  map $arg_fillwidth $fill_step {
    default 0;
    "~^0*([1-9][0-9]?|[12][0-9][0-9]|3[0-3][0-9]|34[0-2])$" 342;
    "~^0*(34[3-9]|3[5-9][0-9]|4[0-9][0-9]|500)$" 500;
  }
  map $img_type_key $img_w {
    default 0;
    primary $fill_step;
    thumb $fill_step;
  }

  # The tag changes when the artwork changes, because Remux gives the row a new id, so a tagged URL
  # never goes stale. An untagged one can.
  # An untagged logo lives longer than other untagged images, because the warmer keeps that form ready and
  # a copy lapsing daily would be no use. An old logo there is harmless.
  map "$arg_tag:$img_type_key" $img_ttl {
    default 10368000;
    ":logo" 2592000;
    "~^:" 86400;
  }
  map $arg_tag $cc_by_tag {
    default "public, max-age=2592000, immutable";
    "" "public, max-age=86400";
  }
  # A client can't be told to forget, so only a real image gets a long life, here and on disk.
  map $sent_http_content_type $img_cc {
    default "no-store";
    "~*^image/" $cc_by_tag;
  }
  map $upstream_http_content_type $keep_for {
    default 0;
    "~*^image/" $http_x_img_ttl;
  }

  # Only JPEGs get resized. Anything else gets a width no image reaches, which sends it unchanged,
  # as long as the filter can read it. If it can't, the fallback below sends the original anyway.
  map $upstream_http_content_type $fit_w {
    default 99999;
    "~*^image/jpe?g" $req_w;
  }

  # A note to the warmer for each image a viewer gets: the item and type only, no address or query string.
  # nginx doesn't wait for it, and drops it if it can't be sent. See warmer/README.md.
  log_format warm_signal '$img_id_key $img_type_key';
  map "$request_method:$status:$http_x_image_warmer" $warm_signal {
    default 0;
    "GET:200:" 1;
    "GET:304:" 1;
  }

  # Remux also answers 404 when its source fails for a moment, so a 404 only the warmer asked for isn't kept,
  # or a viewer arriving after the source recovers would be given it. A viewer's own 404 is kept as before.
  map "$http_x_image_warmer:$upstream_status" $warm_no_store {
    default 0;
    "1:404" 1;
  }

  # Front: checks the request and answers from the disk cache.
  server {
    listen 8080;
    set $remux http://remux:3000;
    proxy_http_version 1.1;
    # The image route needs no sign-in and the answer is shared, so no client header goes upstream.
    proxy_pass_request_headers off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Vary;
    # Never store one client's cookie in an answer every client shares.
    proxy_hide_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;

    # For the healthcheck. A path holding ..%2F can reach this from outside too. It says only "ok".
    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location ~* "^(?:/emby|/jellyfin)?/items/(?<img_id>[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12})/images/(?<img_type>primary|thumb|backdrop|logo|logoimageaspectratio)(?<img_idx>/[0-9]{1,9})?/*$" {
      limit_except GET { deny all; }
      if ($tag_ok = 0) { return 403; }

      proxy_pass http://127.0.0.1:8081/$img_w/items/$img_id_key/images/$img_type_key$img_idx;
      proxy_set_header X-Img-Ttl $img_ttl;
      proxy_read_timeout 60s;
      # Finish a fetch even if the viewer scrolled away, so the work isn't wasted and others can use it.
      proxy_ignore_client_abort on;

      proxy_cache img;
      proxy_cache_key "$img_id_key|$img_type_key$img_idx_key|$arg_tag|$img_w";
      proxy_cache_valid 200 120d;
      proxy_no_cache $warm_no_store;
      # Remux also answers 404 when TMDB fails for a moment, so this stays short.
      proxy_cache_valid 404 5m;
      proxy_cache_lock on;
      # Others asking for the same new image wait for the first fetch, up to :8081's read timeout.
      proxy_cache_lock_age 35s;
      proxy_cache_lock_timeout 35s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
      proxy_force_ranges on;

      # :8081 failed, is too busy, or the image couldn't be resized. Remux may still be able to answer.
      proxy_intercept_errors on;
      error_page 415 502 503 504 = @direct;

      add_header Cache-Control $img_cc;
      add_header Access-Control-Allow-Origin "*" always;
      add_header X-Img-Cache $upstream_cache_status always;
      access_log syslog:server=unix:/run/warmer/signal.sock,tag=warm,nohostname warm_signal if=$warm_signal;
    }

    # Straight to Remux, not resized and not kept on disk.
    location @direct {
      proxy_pass $remux/items/$img_id_key/images/$img_type_key$img_idx;
      proxy_connect_timeout 3s;
      proxy_read_timeout 35s;
      add_header Cache-Control "public, max-age=300";
      add_header Access-Control-Allow-Origin "*" always;
      add_header X-Img-Cache DIRECT always;
    }

    # An id that isn't a UUID, an unknown type or an extra path segment. Remux can't serve these
    # either. Never pass $uri upstream: nginx has already decoded it.
    location / {
      return 404;
    }
  }

  # Back: fetches from Remux and resizes. Baseline JPEG, because progressive costs more to decode.
  server {
    listen 127.0.0.1:8081;
    set $remux http://remux:3000;
    limit_req zone=remux_fetch burst=300 delay=40;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_connect_timeout 3s;
    # Remux can take about 30 s: two fetches of up to 15 s each for a synthetic thumb.
    proxy_read_timeout 35s;
    proxy_buffer_size 16k;
    proxy_buffers 32 16k;
    # A filter that fails partway keeps the request open with nothing to send, so don't wait long.
    send_timeout 5s;
    # Says how long :8080 keeps it. It goes on a 200, so a 404 follows proxy_cache_valid above. It also
    # stays on the 502 for an answer over the 16 MB limit that gives its length, so :8080 remembers that
    # refusal in memory and goes straight to Remux next time. A passing failure never carries it.
    add_header X-Accel-Expires $keep_for;

    location ~ "^/(?<req_w>342|500)(?<up_path>/items/[0-9a-fA-F]{32}/images/[a-z]+(?:/[0-9]+)?)$" {
      proxy_pass $remux$up_path;
      image_filter resize $fit_w -;
      image_filter_jpeg_quality 78;
      image_filter_interlace off;
      # A resize holds the whole image in memory. Real posters reach 1.4 MB; anything over this limit
      # falls back to the original.
      image_filter_buffer 16M;

      # Answered without running the filter, which would otherwise turn a 404 into a 415.
      proxy_intercept_errors on;
      error_page 404 = @not_found;
      # 415 is the filter giving up, on any response that isn't a readable image of a sensible size,
      # which includes every other error from Remux. 502 and 504 keep nginx's own error page out of
      # the filter. :8080 turns the 502 into a direct fetch. A proxy_pass can't go here: nginx kills
      # it when the filter fails partway through a body.
      error_page 415 502 504 = @filter_failed;
    }

    location ~ "^/0(?<up_path>/items/[0-9a-fA-F]{32}/images/[a-z]+(?:/[0-9]+)?)$" {
      proxy_pass $remux$up_path;
      # Sends the bytes unchanged, but only if they start like a JPEG, GIF, PNG or WebP, so a bad
      # answer is never kept for months. Anything else, an SVG logo included, still reaches the client
      # through :8080's direct fetch, at the cost of a second fetch each time and no disk copy.
      image_filter test;
      image_filter_buffer 16M;
      proxy_intercept_errors on;
      error_page 404 = @not_found;
      error_page 415 502 504 = @filter_failed;
    }

    location @not_found {
      return 404;
    }

    location @filter_failed {
      return 502;
    }

    location / {
      return 404;
    }
  }
}
